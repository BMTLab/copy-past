# .github/workflows/ci-lint.yml
#
# Runs shellcheck + shfmt on the scripts and the tests,
# plus the custom style gates defined in tests/integration/test_code_style.bats.
# Adds a build-info section to the run summary,
# so reviewers can see exactly which versions of the tools produced the verdict.

name: Lint & Style CI

on:
  workflow_call:

jobs:
  lint:
    name: Lint & Style
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      contents: read
      checks: write
      pull-requests: write

    steps:
      - name: ⚙️ Checkout
        uses: actions/checkout@v7.0.0
        with:
          fetch-depth: 1
          # We do not push back from this job,
          # so credentials are not needed.
          # checkout@v7 still stores the token under $RUNNER_TEMP by default,
          # but turning persist-credentials off eliminates the file entirely
          # and is one less thing to worry about
          # if the workspace is later archived or cached.
          persist-credentials: false

# region Install tooling

      # Pin tool versions:
      # apt bash is recent enough on ubuntu-latest, so it stays.
      # shellcheck and shfmt do not come from apt:
      # its versions are older and report or write some lines
      # otherwise than the maintainer's, so CI takes the release binary
      # of the version the maintainer runs,
      # checked against the digest of that release asset.
      # bats comes from its pinned tag, as in ci-test.yml:
      # the style gate needs bats_test_function, from bats 1.11.0 on,
      # and apt has 1.10.0.
      # No way needs a third-party action
      # that could be compromised or rate-limited.
      - name: 🔧 Install lint tooling
        env:
          # To move one: change its version, then take the new digest
          # from `gh release view vX.Y.Z --repo mvdan/sh --json assets`,
          # or from `--repo koalaman/shellcheck` (the linux.x86_64 .tar.xz).
          SHFMT_VERSION: '3.14.1'
          SHFMT_SHA256: '76e77641faa025814b77f153b29796b8e6fa2fca03e0c76a691608b86c7ea7bf'
          SHELLCHECK_VERSION: '0.11.0'
          SHELLCHECK_SHA256: '8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198'
          BATS_VERSION: 'v1.11.0'
        run: |
          set -o errexit -o nounset -o pipefail

          tools="${RUNNER_TEMP}/tools"
          mkdir -p "${tools}"

          echo '::group::shellcheck'
          archive="${RUNNER_TEMP}/shellcheck.tar.xz"
          curl --fail --silent --show-error --location --retry 3 \
            --output "${archive}" \
            "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          echo "${SHELLCHECK_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xJf "${archive}" -C "${RUNNER_TEMP}"
          install -m 0755 "${RUNNER_TEMP}/shellcheck-v${SHELLCHECK_VERSION}/shellcheck" "${tools}/shellcheck"
          echo '::endgroup::'

          echo '::group::shfmt'
          curl --fail --silent --show-error --location --retry 3 \
            --output "${tools}/shfmt" \
            "https://github.com/mvdan/sh/releases/download/v${SHFMT_VERSION}/shfmt_v${SHFMT_VERSION}_linux_amd64"
          echo "${SHFMT_SHA256}  ${tools}/shfmt" | sha256sum --check --strict
          chmod 0755 "${tools}/shfmt"
          echo '::endgroup::'

          echo '::group::bats-core'
          git clone --depth 1 --branch "${BATS_VERSION}" \
            https://github.com/bats-core/bats-core.git "${RUNNER_TEMP}/bats-core"
          sudo "${RUNNER_TEMP}/bats-core/install.sh" /usr/local
          echo '::endgroup::'

          echo "${tools}" >>"${GITHUB_PATH}"

          echo "::notice title=Lint setup::shellcheck v${SHELLCHECK_VERSION} and shfmt v${SHFMT_VERSION} by digest, bats ${BATS_VERSION} from its tag"

      - name: ℹ️ Tool versions
        run: |
          echo '::group::Versions'
          bash --version | head -n1
          shellcheck --version | head -n3
          shfmt --version
          bats --version
          echo '::endgroup::'

          # Surface the actual versions on the run summary,
          # so reviewers can see which toolchain produced the verdict
          # without expanding the log group.
          shellcheck_v="$(shellcheck --version | grep -oE 'version: [0-9.]+' | head -n1)"
          shfmt_v="v$(shfmt --version)"
          bats_v="$(bats --version)"
          echo "::notice title=Tool versions::shellcheck ${shellcheck_v}, shfmt ${shfmt_v}, ${bats_v}"

# endregion

# region Lint & style checks

      # The Makefile encapsulates the exact lint commands used locally,
      # so CI matches `make check` byte-for-byte.
      - name: 🔍 shellcheck
        run: |
          set -o errexit -o nounset -o pipefail
          make lint
          echo '::notice title=shellcheck::No findings in the scripts and the tests'

      - name: 🎨 shfmt
        run: |
          set -o errexit -o nounset -o pipefail
          make format-check
          echo '::notice title=shfmt::Formatting matches the project style'

      # Runs ONLY the style-gate bats file,
      # which checks the header card and the execution guard,
      # the exit codes in the header and the README,
      # and the shfmt diff (idempotency check).
      - name: 🧪 Custom style gate (bats)
        run: |
          set -o errexit -o nounset -o pipefail
          bats tests/integration/test_code_style.bats
          echo '::notice title=Style gate::Header cards, guards and shfmt checks passed'

# endregion

# region Job summary

      - name: 📊 Summary
        if: ${{ always() }}
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          set -o errexit -o nounset -o pipefail

          #######################################
          # Map the `job.status` GitHub context value
          # to a single-character status glyph.
          #
          # Arguments:
          #   1: GitHub Actions job status
          #      ('success', 'failure', 'cancelled', 'skipped').
          # Outputs (stdout):
          #   '✅' for success, '❌' otherwise.
          #######################################
          function status_glyph() {
            local -r status="$1"

            if [[ "$status" == 'success' ]]; then
              printf '✅'
            else
              printf '❌'
            fi
          }

          #######################################
          # Append a single check row to the GitHub step summary.
          #
          # Arguments:
          #   1: human-readable check name.
          #   2: status glyph from status_glyph().
          # Outputs:
          #   Appends '| <name> | <glyph> |'
          #   to $GITHUB_STEP_SUMMARY.
          #######################################
          function append_row() {
            local -r name="$1"
            local -r glyph="$2"

            printf '| %-10s | %s |\n' "$name" "$glyph" \
              >> "$GITHUB_STEP_SUMMARY"
          }

          #######################################
          # Render the full summary section.
          #
          # Globals:
          #   JOB_STATUS, GITHUB_STEP_SUMMARY (read).
          #######################################
          function main() {
            local glyph
            glyph="$(status_glyph "$JOB_STATUS")"

            {
              echo '## 🧹 Lint & Style'
              echo
              echo '| Check      | Status |'
              echo '|------------|--------|'
            } >> "$GITHUB_STEP_SUMMARY"

            append_row 'shellcheck' "$glyph"
            append_row 'shfmt'      "$glyph"
            append_row 'style gate' "$glyph"
          }

          main "$@"

# endregion
